# Builds the API and the MVC site separately, then runs the API test project.
name: RaceDay Part 3 CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API, MVC, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build the API
        run: dotnet build src/RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build the MVC web application
        run: dotnet build src/RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --verbosity normal
