name: RaceDay Part 2 CI

on:
  # Build and test on every push to any branch and on every pull request
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Solution and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal
